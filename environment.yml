name: thesis_lse_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  # Data processing
  - pandas
  - numpy
  # Spatial analysis
  - geopandas
  - shapely
  - pyproj
  - pyarrow
  # Visualisation
  - matplotlib
  - seaborn
  # Statistical modelling
  - statsmodels
  - scikit-learn
  # Date handling
  - python-dateutil
  # Notebook
  - jupyterlab
  - ipykernel
  # Pip-only packages
  - pip
  - pip:
    - rdrobust
    - rddensity
    - lpdensity